services:

  security-config-server:
    image: boklu/security-config-server:latest
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    image: boklu/eureka-server:latest
    ports:
      - "8761:8761"
    depends_on:
      security-config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: boklu/api-gateway:latest
    ports:
      - "8765:8765"
    depends_on:
      eureka-server:
        condition: service_healthy

  scanmanagementservice:
    image: boklu/scanmanagementservice:latest
    ports:
      - "8181:8181"
      - "5005:5005"
    depends_on:
      eureka-server:
        condition: service_healthy

  scanorchestrationservice:
    image: boklu/scanorchestrationservice:latest
    ports:
      - "8182:8182"
      - "5006:5006"
    depends_on:
      eureka-server:
        condition: service_healthy

  riskscoringservice:
    image: boklu/riskscoringservice:latest
    ports:
      - "8183:8183"
      - "5007:5007" 
    depends_on:
      eureka-server:
        condition: service_healthy

  boklu-securities:
    image: boklu/boklu-securities:latest
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"